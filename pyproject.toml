[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "FEL-helper"
version = "0.1.0"
description = "Fast, independently developed decoder for selected records in Fluke FEL recordings"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]
authors = [{name = "Jason Strebe"}]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
fel-helper = "fel_decoder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
